<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="768" viewBox="0 0 1280 768">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#caa67a"/>
      <stop offset="100%" stop-color="#e0c19b"/>
    </linearGradient>
    <radialGradient id="lamp" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe8b5" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ffe8b5" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>

  <rect width="1280" height="768" fill="url(#bg)"/>

  <!-- window -->
  <rect x="760" y="120" width="430" height="500" rx="8" fill="#f3d9b6"/>
  <rect x="775" y="135" width="400" height="470" fill="#f8e7cd" opacity="0.65"/>

  <!-- table -->
  <rect x="130" y="520" width="860" height="200" rx="28" fill="#7f5539"/>

  <!-- cups -->
  <g fill="#efe3d2">
    <rect x="330" y="450" width="95" height="88" rx="16"/>
    <rect x="360" y="430" width="36" height="22" rx="4"/>
    <rect x="530" y="450" width="95" height="88" rx="16"/>
    <rect x="560" y="430" width="36" height="22" rx="4"/>
    <rect x="730" y="450" width="95" height="88" rx="16"/>
    <rect x="760" y="430" width="36" height="22" rx="4"/>
  </g>

  <!-- hanging lights -->
  <g>
    <line x1="220" y1="0" x2="220" y2="150" stroke="#4a3429" stroke-width="4"/>
    <circle cx="220" cy="175" r="36" fill="#ffd58f"/>
    <circle cx="220" cy="175" r="84" fill="url(#lamp)"/>

    <line x1="420" y1="0" x2="420" y2="150" stroke="#4a3429" stroke-width="4"/>
    <circle cx="420" cy="175" r="36" fill="#ffd58f"/>
    <circle cx="420" cy="175" r="84" fill="url(#lamp)"/>

    <line x1="620" y1="0" x2="620" y2="150" stroke="#4a3429" stroke-width="4"/>
    <circle cx="620" cy="175" r="36" fill="#ffd58f"/>
    <circle cx="620" cy="175" r="84" fill="url(#lamp)"/>
  </g>

  <!-- plant -->
  <g fill="#5b7a4d">
    <polygon points="1060,620 1090,460 1120,620"/>
    <polygon points="1130,620 1170,430 1210,620"/>
    <polygon points="1020,620 1050,500 1080,620"/>
  </g>

  <!-- soft vignette -->
  <ellipse cx="640" cy="380" rx="760" ry="500" fill="#000" opacity="0.10" filter="url(#blur)"/>

  <text x="88" y="88" fill="#fff6e8" font-size="46" font-family="'Noto Sans KR', sans-serif" letter-spacing="1">서울 근교 감성 카페 무드</text>
  <text x="90" y="132" fill="#fff1dc" font-size="24" font-family="'Noto Sans KR', sans-serif" opacity="0.95">따뜻한 조명 · 우드 톤 · 창밖의 여유</text>
</svg>
